<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pediatric Oral Liquid Antibiotic Dosing Converter</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">



      <!--Patient Information-->
      <div class="calculator-card">
        <header class="title-bar">
          <span>Patient</span>
        </header>

        <div>
          <label class="field weight-field">
            <span>Weight</span>
            <div class="inline-input">
              <input id="weightKg" type="number" min="0" step="0.1" placeholder="0" required/>
              <button id="weight-unit-toggle" type="button" class="unit-toggle" data-unit="kg" aria-label="Switch weight unit between kilograms and pounds">
                kg
              </button>
            </div>
          </label>
        </div>
      </div>



      <!--Prescription Information-->
      <div class="calculator-card" id="prescription-box">
        <header class="title-bar">
          <span>Prescription</span>
        </header>

        <div id="rx">
          <label class="field">
            <span>Drug</span>
            <select id="drugName" aria-label="Drug name">
              <option value="">Select antibiotic</option>
            </select>
          </label>

          <label class="field">
            <span>Quantity</span>
            <div class="inline-input">
              <input id="quantity" type="number" min="0" step="0.1" placeholder="0" />
              <button id="quantity-unit-toggle" type="button" class="unit-toggle" data-unit="mg" aria-label="Switch quantity unit between milligrams and milliliters">
                mg
              </button>
            </div>
          </label>

          <label id="strengthField" class="field hidden">
            <span>Strength</span>
            <div class="inline-input">
              <select id="strength">
                <option value="">Select strength</option>
              </select>
            </div>
          </label>

          <label class="field">
            <span>Frequency</span>
            <div class="inline-input">
              <input id="frequency" type="text" placeholder="q4h q6h BID TID" />
              <small id="frequency-units">hour(s)</small>
            </div>
          </label>

          <label class="field">
            <span>Duration</span>
            <div class="inline-input">
              <input id="duration" type="number" step=1 placeholder="1" />
              <small>day(s)</small>
            </div>
          </label>
        </div>
        
        <div>
          <button id="addNewRx" class="unit-button">+ Antibiotic</button>
        </div>
      </div>
      


      <!--Summary Information-->
      <div class="calculator-card">
        <div class="title-bar">
          <span>Summary</span>
        </div>

        <div class="summary-body">
          <p class="summary-line">
            <span class="label">Medication</span>
            <strong id="summaryMedication">—</strong>
          </p>

          <p class="summary-line">
            <span class="label">Daily dose</span>
            <strong id="summaryDailyDose">—</strong>
          </p>

          <p class="summary-line">
            <span class="label">Dose per day</span>
            <strong id="summaryDosePerDay">—</strong>
          </p>

          <div class="result-box">
            <div class="result-line">
              <span>Total</span>
              <strong id="resultValue">—</strong>
            </div>
            <div class="result-line small-line">
              <span>Reference</span>
              <strong id="referenceValue">—</strong>
            </div>
            <div class="status-wrap">
              <span id="statusBadge" class="status-badge neutral">Awaiting input</span>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
